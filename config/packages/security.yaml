security:
    # Un administrateur a aussi les droits d'un modérateur
    role_hierarchy:
        ROLE_ADMIN: ROLE_MODERATOR
        ROLE_MODERATOR: ROLE_USER

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # sert à recharger l'utilisateur depuis la session et pour d'autres fonctions (ex. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Les outils de développement et les ressources statiques restent toujours autorisés
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        
        # Firewall pour l'authentification API (JWT)
        api_login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Refresh et déconnexion de la session : authentifiés par le cookie HttpOnly (voir TokenController),
        # hors du firewall JWT pour qu'un JWT expiré joint par erreur ne bloque pas le renouvellement
        api_token:
            pattern: ^/api/token
            stateless: true
            security: false

        # Firewall pour les routes API sécurisées
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # Firewall principal pour le back-office
        main:
            lazy: true
            provider: app_user_provider
            
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_main
                failure_path: app_login
            
            logout:
                path: app_logout
                target: app_login

    # Remarque : seule la *première* règle correspondante est appliquée
    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/password, roles: PUBLIC_ACCESS }
        - { path: ^/api/email/, roles: PUBLIC_ACCESS }
        - { path: ^/api/feedback, roles: PUBLIC_ACCESS }
        - { path: ^/api/memories, roles: PUBLIC_ACCESS }
        - { path: ^/api/memory, roles: PUBLIC_ACCESS }
        - { path: ^/api/locations, roles: PUBLIC_ACCESS }
        - { path: ^/api/quiz, roles: PUBLIC_ACCESS } # classement (JWT facultatif) ; le jeu est sous /api/secure/quiz
        - { path: ^/api/secure, roles: IS_AUTHENTICATED_FULLY }
        # Back-office : connexion (/), inscription et mot de passe oublié restent hors de /back
        - { path: ^/back/(moderation|reports|comments)(/|$), roles: ROLE_MODERATOR }
        - { path: ^/back$, roles: ROLE_MODERATOR }
        - { path: ^/back, roles: ROLE_ADMIN }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Les hacheurs de mots de passe sont coûteux par conception, pour la sécurité.
            # En test, on peut réduire ce coût pour gagner en performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
